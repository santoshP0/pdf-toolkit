<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Quill — hand-drawn feather mark. Ink #1a1a1a + highlighter #fde047 on warm paper. -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="#f5efe6" stroke="#1a1a1a" stroke-width="2.6"/>

  <!-- highlighter swash behind the feather -->
  <path d="M17 47 L45 18" stroke="#fde047" stroke-width="11" stroke-linecap="round" opacity="0.9"/>

  <!-- feather vane -->
  <path d="M48 12 C 57 24, 49 41, 23 47 C 30 33, 33 21, 48 12 Z"
        fill="#fbf9f5" stroke="#1a1a1a" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- central vein, continuing into the nib -->
  <path d="M48 12 Q 33 29 18 52" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round"/>

  <!-- barbs -->
  <g stroke="#1a1a1a" stroke-width="1.7" stroke-linecap="round">
    <path d="M43 18 L49 17"/>
    <path d="M38 25 L45 25"/>
    <path d="M33 32 L41 33"/>
    <path d="M28 39 L36 41"/>
    <path d="M40 22 L36 27"/>
    <path d="M35 29 L31 34"/>
  </g>

  <!-- split nib -->
  <path d="M23 47 L18 52 L26 49 Z" fill="#1a1a1a"/>

  <!-- ink drop -->
  <circle cx="15" cy="55" r="2.1" fill="#6b21a8"/>
</svg>
